name: Update Assets

on:
  push:
  workflow_dispatch:
  schedule:
   - cron: '0 * * * *'
  

jobs:
  update:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Test conversions
        run: swift test
      - name: Create build folder
        run: mkdir build
      - name: Build
        run: xcodebuild -project JSON2Proto.xcodeproj -scheme JSON2Proto -configuration Release -derivedDataPath ./build -destination "generic/platform=macOS" -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_STYLE=Manual DEVELOPMENT_TEAM=""
      - name: Create output folder
        run: mkdir output
      - name: Run JSON2Proto
        run: ./build/Build/Products/Release/JSON2Proto output/
      - name: Compress results
        run: |
          for name in gacha character event card; do
            test -s "output/$name.proto"
            aa archive -i "output/$name.proto" -o "output/$name.aar"
          done
          # Keep raw Protobuf files for SekaiKit and archives for existing clients.
      - name: Commit results
        env:
          EXTERNAL_PAT: ${{ secrets.MEMZ_REPO_PAT }}
        run: |
          cd output
          git init
          git config --global user.email "sakiko@darock.top"
          git config --global user.name "Sakiko Togawa"
          git remote add origin https://${EXTERNAL_PAT}@github.com/Chorus-ACE/Sekai-Protobuf-Assets.git
          git add .
          git commit -m 'Update Assets'
          git branch -M main
          git push -u origin main --force
